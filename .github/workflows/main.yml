name: Build SMSIFYHUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SMSIFYHUB-main-yml.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SMSIFYHUB-main-yml.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            echo "ZIP files available in repository:"
            find . -maxdepth 4 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p android-project
          unzip -oq "$ZIP_FILE" -d android-project

          PROJECT_DIR=""
          while IFS= read -r -d '' settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/app/build.gradle.kts" ] || [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find android-project -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            find android-project -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build SMSIFYHUB APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "ERROR: Gradle wrapper (gradlew) is missing from the Android project."
            exit 1
          fi

          APK_FILE="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/smsifyhubv2.apk"
          echo "APK created: smsifyhubv2.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-APK
          path: smsifyhubv2.apk
          if-no-files-found: error
          retention-days: 7
