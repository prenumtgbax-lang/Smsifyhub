name: Build SMSIFYHUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SMSIFYHUB_Mobile_Build_Ready.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        run: |
          ZIP_FILE="SMSIFYHUB_Mobile_Build_Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          PROJECT_DIR=$(find android-project -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
