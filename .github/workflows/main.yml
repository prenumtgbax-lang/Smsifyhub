name: Build SMSIFYHUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew file not found in repository root"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
