name: Build SMSIFYHUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SMSIFYHUB_Android_Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        run: |
          ZIP_FILE="SMSIFYHUB_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root"
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname "*.zip"
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          PROJECT_DIR=$(find android-project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix accidental literal newline in settings.gradle.kts
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          for name in ("settings.gradle.kts", "settings.gradle"):
              file = project / name
              if file.exists():
                  text = file.read_text(encoding="utf-8")
                  text = text.replace(r"\n", "\n")
                  file.write_text(text, encoding="utf-8")
                  print(f"Checked and fixed literal \\n in {file}")
          PY

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
