name: Build SMSIFYHUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Extract Android Project
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the expected fixed ZIP name; otherwise find an SMSIFYHUB ZIP.
          ZIP_FILE=""
          if [ -f "SMSIFYHUB_Android_Project_FIXED.zip" ]; then
            ZIP_FILE="SMSIFYHUB_Android_Project_FIXED.zip"
          else
            ZIP_FILE="$(find . -maxdepth 4 -type f \
              -iname '*smsifyhub*.zip' \
              -not -path './android-project/*' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Could not find an SMSIFYHUB ZIP file."
            echo "ZIP files available in repository:"
            find . -maxdepth 4 -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          mkdir -p android-project
          unzip -oq "$ZIP_FILE" -d android-project

          echo "Searching for Android Gradle project..."
          PROJECT_DIR=""

          while IFS= read -r -d '' settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || \
               [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find android-project -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate a valid Android project."
            echo "Extracted files:"
            find android-project -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 4. Fix accidental literal newline sequences in Gradle files only
      - name: Fix Accidental Literal Newlines
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          gradle_names = {
              "settings.gradle",
              "settings.gradle.kts",
              "build.gradle",
              "build.gradle.kts",
          }

          for file in project.rglob("*"):
              if not file.is_file() or file.name not in gradle_names:
                  continue

              original = file.read_text(encoding="utf-8")
              fixed = original.replace("\\r\\n", "\n")
              fixed = fixed.replace("\\n", "\n")

              if fixed != original:
                  file.write_text(fixed, encoding="utf-8")
                  print(f"FIXED: {file}")
              else:
                  print(f"CHECKED: {file}")
          PY

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 6. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Checking Android project..."

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Gradle wrapper not found; using installed Gradle."
            gradle assembleDebug --no-daemon
          fi

          echo "Checking generated APK..."
          find . -type f -path "*/build/outputs/apk/debug/*.apk" -print

          if ! find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit | grep -q .; then
            echo "ERROR: Build finished but no debug APK was found."
            exit 1
          fi

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-APK
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
