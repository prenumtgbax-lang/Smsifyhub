name: Build SMSIFYHUB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "SMSIFYHUB_Mobile_Build_Ready.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SMSIFYHUB ZIP file not found!"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "ZIP extracted successfully"
          find source -maxdepth 4 -type f | head -n 100

      - name: Locate Android Project
        run: |
          GRADLE_FILE=$(find source -type f -name "gradlew" | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
          else
            PROJECT_DIR=$(find source -type f -name "settings.gradle*" \
              -not -path "*/build/*" | head -n 1 | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
