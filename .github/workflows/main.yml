name: Build SMSIFYHUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SMSIFYHUB_Android_Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SMSIFYHUB_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            echo "ZIP files available:"
            find . -maxdepth 3 -type f -iname "*.zip"
            exit 1
          fi

          mkdir -p android-project
          unzip -oq "$ZIP_FILE" -d android-project

          PROJECT_DIR=""

          while IFS= read -r file; do
            if grep -qE '^[[:space:]]*include[[:space:]]*\(?["'\'']?:app' "$file" 2>/dev/null; then
              PROJECT_DIR="$(dirname "$file")"
              break
            fi
          done < <(
            find android-project -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android settings.gradle file not found"
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix Accidental Literal Newlines
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          gradle_names = {
              "settings.gradle",
              "settings.gradle.kts",
              "build.gradle",
              "build.gradle.kts",
          }

          for file in project.rglob("*"):
              if not file.is_file() or file.name not in gradle_names:
                  continue

              original = file.read_text(encoding="utf-8")
              fixed = original.replace("\\r\\n", "\n")
              fixed = fixed.replace("\\n", "\n")

              if fixed != original:
                  file.write_text(fixed, encoding="utf-8")
                  print(f"FIXED: {file}")
              else:
                  print(f"CHECKED: {file}")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Checking Android project..."

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-APK
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
