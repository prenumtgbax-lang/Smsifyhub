name: Build SMSIFYHUB APK

on:
  workflow_dispatch:
  push:
    paths:
      - "smsifyhub_android_project_fixed (2).zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="smsifyhub_android_project_fixed (2).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname "*.zip"
            exit 1
          fi

          mkdir -p android-project
          unzip -oq "$ZIP_FILE" -d android-project

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || \
               [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find android-project -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP"
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build SMSIFYHUB APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file was not generated"
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/smsifyhubv2.apk"

          echo "APK created successfully: smsifyhubv2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smsifyhubv2
          path: smsifyhubv2.apk
          if-no-files-found: error
          retention-days: 7
